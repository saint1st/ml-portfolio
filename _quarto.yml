project:
  type: website
  output-dir: _site

website:
  title: "Darkhan Islam"
  site-url: "https://saint1st.github.io/ml-portfolio/"
  description: "Machine Learning, Computer Vision, and Data Science."
  favicon: images/favicon.png

  


  sidebar:
    style: docked
    background: "#2A3439"
    foreground: "#c9d1d9"
    border: false
    search: true
    contents:
      - section: "Posts"
        contents:
          - posts/post-with-code/index.qmd
          - posts/post2/index.qmd
          - posts/post3/index.qmd
          - posts/post4/index.qmd
          - posts/post5/index.qmd
          - posts/post6/index.qmd
          - posts/post7/index.qmd
          - posts/welcome/index.qmd

  navbar:
    background: secondary
    left:
      - text: Blog
        href: index.qmd
      - text: Projects
        href: projects.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/saint1st
      - icon: linkedin
        href: https://www.linkedin.com/in/dmazhi/

  



  page-footer:
    left: "© Darkhan Islam"
    right: ""

  search: true

format:
  html:
    page-layout: article
    theme:
      light: cosmo
      dark: darkly
    highlight-style: atom-one
    toc: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    css: styles.css
    include-in-header:
      - fonts.html
    link-external-newwindow: true


